name: CI
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      # config/test.exs connects to localhost:5432 as postgres/postgres;
      # ecto.create (via the `test` alias) provisions baudflow_test.
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.20.1"
          otp-version: "29.0.1"
      - uses: actions/cache@v5
        with:
          path: |
            deps
            _build
            priv/plts
          key: ${{ runner.os }}-mix-${{ hashFiles('**/mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-
      - run: mix deps.get
      - run: mix lint        # format, unused deps, warnings-as-errors, credo, sobelow, dialyzer
      # `mix test` auto-sets MIX_ENV=test against the postgres service on localhost:5432
      - run: mix test
