name: CI
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.18.2"
          otp-version: "27.3"
      - uses: actions/cache@v4
        with:
          path: |
            deps
            _build
            priv/plts
          key: ${{ runner.os }}-mix-${{ hashFiles('**/mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-
      - run: mix deps.get
      - run: mix lint        # format, unused deps, warnings-as-errors, credo, sobelow, dialyzer
      # testcontainers boots Postgres via the host Docker daemon and sets DATABASE_URL
      - run: MIX_ENV=test mix testcontainers.run --database postgres test
