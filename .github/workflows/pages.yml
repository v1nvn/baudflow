name: Deploy site to Pages

on:
  # Rebuild the site when the Astro project (in docs/) changes, or when this
  # workflow itself changes. Elixir-only commits don't trigger a redeploy.
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

# Allow GITHUB_TOKEN to read the repo and publish a Pages deployment.
permissions:
  contents: read
  pages: write
  id-token: write

# One in-flight deploy at a time; superseded runs are cancelled.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Build Astro site
        uses: withastro/action@v6
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
