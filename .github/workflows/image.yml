name: Image

on:
  push:
    tags: ["v*"]

# Images are only built for version tags — the release workflow
# creates the tag after CI passes on main.
jobs:
  build:
    uses: docker/github-builder/.github/workflows/build.yml@v1.10.0
    permissions:
      contents: read
      id-token: write
      packages: write
    with:
      output: image
      push: true
      platforms: linux/amd64,linux/arm64
      cache: true
      cache-mode: max
      meta-images: ghcr.io/${{ github.repository }}
      meta-tags: |
        type=semver,pattern={{version}}
        type=sha
    secrets:
      registry-auths: |
        - registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
