apiVersion: apps/v1
kind: Deployment
metadata:
  name: baudflow
  namespace: baudflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: baudflow
  template:
    metadata:
      labels:
        app: baudflow
    spec:
      nodeSelector:
        storage: local
      initContainers:
        # Run migrations before app starts
        - name: migrate
          image: ghcr.io/v1nvn/baudflow:latest
          command: ["/app/bin/migrate"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: baudflow-db-app
                  key: uri
            - name: SECRET_KEY_BASE
              valueFrom:
                secretKeyRef:
                  name: baudflow-secrets
                  key: secret-key-base
            - name: PHX_HOST
              value: baudflow.v1n.space
      containers:
        - name: baudflow
          image: ghcr.io/v1nvn/baudflow:latest
          ports:
            - containerPort: 4000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: baudflow-db-app
                  key: uri
            - name: SECRET_KEY_BASE
              valueFrom:
                secretKeyRef:
                  name: baudflow-secrets
                  key: secret-key-base
            - name: PHX_HOST
              value: baudflow.v1n.space
            - name: PORT
              value: "4000"
          resources:
            requests:
              memory: 256Mi
              cpu: 50m
            limits:
              memory: 512Mi
              cpu: 500m
          livenessProbe:
            httpGet:
              path: /health
              port: 4000
            initialDelaySeconds: 30
            periodSeconds: 60
          readinessProbe:
            httpGet:
              path: /health
              port: 4000
            initialDelaySeconds: 10
            periodSeconds: 10
